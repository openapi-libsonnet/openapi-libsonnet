name: Test

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Restore pip cache
        id: pip-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}

      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/go/bin
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-jsonnet-${{ runner.os }}-${{ runner.arch }}-v0.22.0

      - name: Install test dependencies
        run: |
          python -m pip install pytest PyYAML
          if [ ! -x "$(go env GOPATH)/bin/jsonnet" ]; then
            go install github.com/google/go-jsonnet/cmd/jsonnet@v0.22.0
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Save pip cache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

      - name: Save Go cache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/go/bin
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - run: pytest
